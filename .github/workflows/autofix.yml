# The workflow name is mandated by autofix.ci.
# It needs to be a dedicated workflow, as autofix.ci times out on long runs.
name: autofix.ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with: { filter: blob:none, fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Run pre-commit hooks
        run: uvx prek run --all-files --show-diff-on-failure --color=always
      - uses: autofix-ci/action@v1.3.4
        if: ${{ !cancelled() }}
