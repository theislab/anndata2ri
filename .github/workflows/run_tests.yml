name: Unit Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get-environments:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip')"
    outputs:
      envs: ${{ steps.get-envs.outputs.envs }}
    steps:
      - uses: actions/checkout@v7
        with: { filter: blob:none, fetch-depth: 0 }
      - uses: prefix-dev/setup-pixi@v0.11.3
        with: { run-install: false }
      - id: get-envs
        run: |
          ENVS_JSON=$(pixi info --json | jq -c '.environments_info | map(select(.name | startswith("test-")) | .name)')
          echo "envs=${ENVS_JSON}" | tee $GITHUB_OUTPUT

  test:
    needs: [get-environments]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.get-environments.outputs.envs) }}
    steps:
      - uses: actions/checkout@v7
        with: { filter: blob:none, fetch-depth: 0 }
      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          environments: ${{ matrix.env }}
          # bioconductor-genomeinfodbdata downloads its data in a post-link script
          configuration: run-post-link-scripts = "insecure"
      - run: pixi run -e ${{ matrix.env }} test --verbose --color=yes

  check:
    if: always()
    needs: [get-environments, test]
    runs-on: ubuntu-latest
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
