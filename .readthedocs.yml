version: 2
build:
  os: ubuntu-26.04
  tools:
    python: "3.14"
  jobs:
    create_environment:
      - asdf plugin add pixi
      - asdf install pixi latest
      - asdf global pixi latest
    install:
      - pixi install -e docs --locked --run-post-link-scripts
    build:
      html:
        - pixi run -e docs build -T
        - mv docs/_build $READTHEDOCS_OUTPUT
